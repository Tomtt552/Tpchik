<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion Island</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff}
.shell{width:100%;height:100%;padding:5px;border-radius:28px;background:linear-gradient(145deg,rgba(30,30,35,.96),rgba(8,8,11,.94));border:1px solid rgba(255,255,255,.13);box-shadow:0 12px 38px #0008, inset 0 1px #ffffff12;overflow:hidden;transition:border-radius .22s,background .22s}
.shell.expanded{border-radius:25px}.top{height:62px;display:flex;align-items:center;gap:10px;padding:0 9px;-webkit-app-region:drag;cursor:grab}.top:active{cursor:grabbing}.art{width:42px;height:42px;flex:none;border-radius:12px;background:linear-gradient(135deg,#34343b,#111);background-size:cover;background-position:center;display:grid;place-items:center;font-size:19px}.meta{min-width:0;flex:1}.title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:10px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;align-items:center;gap:3px;-webkit-app-region:no-drag}.btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:#fff;cursor:pointer}.btn:hover{background:#ffffff18}.btn svg{width:15px;height:15px;fill:currentColor}.play{background:#fff;color:#09090b}.play:hover{background:#ddd}.more{font-size:17px}.progress{height:2px;margin:0 10px 4px;background:#ffffff20;border-radius:4px;overflow:hidden}.fill{height:100%;width:0;background:#fff;transition:width .15s linear}.details{display:none;padding:10px 12px 12px}.expanded .details{display:block}.row{display:flex;justify-content:space-between;color:#999;font-size:10px;margin-bottom:9px}.actions{display:flex;gap:7px}.action{border:1px solid #ffffff18;background:#ffffff0b;color:#ddd;border-radius:10px;padding:7px 10px;font-size:10px;cursor:pointer}.action:hover{background:#ffffff18}.bars{height:14px;display:flex;align-items:center;gap:2px;margin-left:3px}.bars i{width:2px;border-radius:2px;background:#fff;height:4px;opacity:.75;transition:height .09s linear}.playing .bars i{animation:wave .7s ease-in-out infinite alternate}.bars i:nth-child(2n){animation-delay:.2s}.bars i:nth-child(3n){animation-delay:.4s}@keyframes wave{to{height:13px;opacity:1}}
</style></head><body>
<div class="shell" id="shell">
 <div class="top" id="drag">
  <div class="art" id="art">♫</div>
  <div class="meta"><div class="title" id="title">Fusion Desktop</div><div class="artist" id="artist">Ничего не играет</div></div>
  <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="controls">
   <button class="btn" id="prev" title="Предыдущий трек"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
   <button class="btn play" id="play" title="Воспроизведение"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
   <button class="btn" id="next" title="Следующий трек"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></button>
   <button class="btn more" id="expand" title="Развернуть">···</button><button class="btn more" id="quit" title="Выход">×</button>
  </div>
 </div>
 <div class="progress"><div class="fill" id="fill"></div></div>
 <div class="details"><div class="row"><span id="source">Fusion Desktop</span><span id="time">0:00 / 0:00</span></div><div class="actions"><button class="action" id="open">Открыть Fusion</button><button class="action" id="collapse">Свернуть</button><button class="action" id="clickthrough">Не мешать приложениям</button><span class="action" style="cursor:default">Ctrl+Alt+I — переключить клики</span></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let expanded=false,last={};
function fmt(n){n=Math.max(0,Math.floor(Number(n)||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function setExpanded(v){expanded=v;$('shell').classList.toggle('expanded',v);window.islandBridge.resize(v)}
function render(s){last=s||{};$('art').style.backgroundImage=last.art&&(/^https:\/\//i.test(last.art)||/^data:image\/(png|jpeg|webp);base64,/i.test(last.art))?'url('+JSON.stringify(last.art)+')':'';$('art').textContent=last.art?'':'♫';$('title').textContent=last.title||'Ничего не играет';$('artist').textContent=last.artist||last.source||'Fusion Desktop';$('source').textContent=last.source||'Fusion';$('playIcon').innerHTML=last.playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
 const p=last.duration>0?Math.min(100,Math.max(0,last.currentTime/last.duration*100)):0;$('fill').style.width=p+'%';$('time').textContent=fmt(last.currentTime)+' / '+fmt(last.duration);$('shell').classList.toggle('playing',!!last.playing);const bars=$('bars').querySelectorAll('i');(last.spectrum||[]).forEach((v,i)=>{if(bars[i])bars[i].style.height=(3+Math.round(Math.max(0,Math.min(1,v))*13))+'px'});if(!(last.spectrum||[]).length)bars.forEach(b=>b.style.height='4px')}
$('clickthrough').onclick=()=>window.islandBridge.action('toggle-clickthrough');$('play').onclick=()=>window.islandBridge.action('toggle-play');$('prev').onclick=()=>window.islandBridge.action('previous');$('next').onclick=()=>window.islandBridge.action('next');$('open').onclick=()=>window.islandBridge.action('open-player');$('quit').onclick=()=>window.islandBridge.action('quit');$('expand').onclick=()=>setExpanded(!expanded);$('collapse').onclick=()=>setExpanded(false);$('drag').ondblclick=()=>setExpanded(!expanded);
window.islandBridge.onState(render);window.islandBridge.onClickThroughState(v=>{$('clickthrough').textContent=v?'Клики проходят сквозь остров':'Не мешать приложениям'});$('clickthrough').textContent='Не мешать приложениям';setExpanded(false);
</script></body></html>
